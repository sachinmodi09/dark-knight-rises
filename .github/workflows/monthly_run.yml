name: Monthly Pipeline

concurrency:
  group: market-db
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 11 28-31 * 1-5'   # checked daily 28th-31st; only actually runs on the last trading day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_last_trading_day: ${{ steps.check.outputs.is_last_trading_day }}
    steps:
      - name: Determine if today is the last trading day of the month
        id: check
        run: |
          TODAY_MONTH=$(date -u +%Y-%m)
          TOMORROW_MONTH=$(date -u -d "+1 day" +%Y-%m)
          if [ "$TODAY_MONTH" != "$TOMORROW_MONTH" ]; then
            echo "is_last_trading_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_last_trading_day=false" >> "$GITHUB_OUTPUT"
          fi

  monthly:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.is_last_trading_day == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance duckdb pandas

      - run: python scripts/update_monthly.py

      - run: python scripts/mark_breakouts.py

      - run: python scripts/update_daily.py

      - run: python scripts/enrich_breakouts.py

      - name: Commit DB
        run: |
          git config user.email "bot@github.com"
          git config user.name "PipelineBot"

          git add data/market.db
          git diff --cached --quiet || git commit -m "Monthly update $(date +'%Y-%m')"

          git pull --rebase origin main
          git push
