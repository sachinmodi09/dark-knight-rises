name: Monthly Breakout Analysis

on:
  schedule:
    # Runs at 10:30 UTC (4:00 PM IST) on day 28, 29, 30, or 31 of every month.
    # The script `mark_breakouts.py` will contain logic to check if it's the
    # last trading day of the month and exit gracefully if not.
    - cron: '30 10 28-31 * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  run-monthly-scripts:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to commit and push changes to market.db

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install yfinance duckdb pandas

    - name: Run update_monthly.py (Append this month's final candle)
      run: python update_monthly.py

    - name: Run mark_breakouts.py
      run: python mark_breakouts.py
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }} # If mark_breakouts.py also sends emails
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

    - name: Commit market.db and any output files back to repo
      run: |
        git config user.email "bot@github.com"
        git config user.name "PipelineBot"
        git add data/market.db output/*.csv || true # Add market.db and any new CSVs, ignore if no new CSVs
        git diff --cached --quiet || git commit -m "Monthly run: update market.db and breakouts $(date +'%Y-%m-%d')"
        git push
