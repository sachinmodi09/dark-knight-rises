name: Daily Pipeline

concurrency:
  group: market-db
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST (after market close)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance duckdb pandas

      - run: python scripts/update_daily.py

      - run: python scripts/enrich_breakouts.py

      - name: Scan retest and send email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scripts/scan_retest.py

      - name: Commit DB
        run: |
          git config user.email "bot@github.com"
          git config user.name "PipelineBot"

          git add data/market.db
          git diff --cached --quiet || git commit -m "Daily scan $(date +'%Y-%m-%d %H:%M')"

          git pull --rebase origin main
          git push
