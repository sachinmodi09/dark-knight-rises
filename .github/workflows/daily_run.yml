name: Daily Pipeline

# One run a day, after market close: refreshes this month's monthly candle,
# detects any breakouts (confirmed from past closed months, or preliminary
# from the current month), refreshes daily prices, enriches breakout days,
# and scans for retests. GitHub's free-tier scheduled crons don't fire at
# the exact time requested -- in practice this "4 PM IST" trigger has been
# landing closer to 7 PM IST, which is fine: the goal is one alert with the
# full day's settled data, not a specific minute. update_daily.py's
# safe_cutoff_date() guard means a late-firing run is safe either way -- it
# will never write a live/partial bar as the day's close, no matter when
# the job actually starts.

concurrency:
  group: market-db
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST target (observed actual: ~7 PM IST)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance duckdb pandas

      - run: python scripts/update_monthly.py

      - run: python scripts/mark_breakouts.py

      - run: python scripts/update_daily.py

      - run: python scripts/enrich_breakouts.py

      - name: Scan retest and send email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scripts/scan_retest.py

      - name: Commit DB
        run: |
          git config user.email "bot@github.com"
          git config user.name "PipelineBot"

          git add data/market.db
          git diff --cached --quiet || git commit -m "Daily scan $(date +'%Y-%m-%d %H:%M')"

          git pull --rebase origin main
          git push
