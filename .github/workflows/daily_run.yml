name: Daily Pipeline

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 3:30 PM IST Mon-Fri
  workflow_dispatch:           # manual trigger

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance duckdb pandas

      - name: Update daily OHLC
        run: python scripts/update_daily.py

      - name: Enrich breakouts
        run: python scripts/enrich_breakouts.py

      - name: Scan retest
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scripts/scan_retest.py

      - name: Update performance
        run: python scripts/update_perf.py

      - name: Commit DB
        run: |
          git config user.email "bot@github.com"
          git config user.name "PipelineBot"
          git add data/market.db
          git diff --cached --quiet || git commit -m "Daily update $(date +'%Y-%m-%d')"
          git push
